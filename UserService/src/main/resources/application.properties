spring.application.name=user-service
server.port=8081

spring.datasource.url=jdbc:postgresql://localhost:5432/user_db
spring.datasource.username=postgres
spring.datasource.password=password
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JWT (secret must be at least 32 characters; override with env var in real use)
app.jwt.secret=${JWT_SECRET:change-this-to-a-long-random-secret-key-123456}
app.jwt.expiration-ms=86400000

# Eureka is off by default so the service starts without a Eureka server.
eureka.client.enabled=${EUREKA_ENABLED:false}
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICE_URL:http://localhost:8761/eureka/}

management.endpoints.web.exposure.include=health,info
