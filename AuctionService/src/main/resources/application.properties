spring.application.name=auction-service
server.port=8083

# PostgreSQL Configuration (Externalized credentials with local-dev defaults)
spring.datasource.url=jdbc:postgresql://localhost:5432/auction_db?stringtype=unspecified
spring.datasource.username=postgres
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# HikariCP Connection Pool Tuning for Hot-Path Low Latency
spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=5000


# Liquibase Configuration
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
spring.liquibase.enabled=true

# Scheduler Configuration
app.scheduler.batch-size=50
app.scheduler.fixed-delay-ms=5000
app.outbox.fixed-delay-ms=2000

# Kafka Configuration (default off for local dev if Kafka is not running)
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
app.kafka.enabled=${APP_KAFKA_ENABLED:false}
spring.kafka.listener.auto-startup=${APP_KAFKA_ENABLED:false}

spring.kafka.consumer.group-id=auction-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=com.auctionplatform.auctionservice.event.BidPlacedEvent
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false

app.kafka.topics.bid-placed=bid-placed-topic
app.kafka.topics.auction-activated=auction-activated-topic
app.kafka.topics.auction-closed=auction-closed-topic

# Eureka Client Configuration (default off for local dev if Eureka is not running)
eureka.client.enabled=${EUREKA_ENABLED:false}
eureka.client.register-with-eureka=${EUREKA_ENABLED:false}
eureka.client.fetch-registry=${EUREKA_ENABLED:false}
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICE_URL:http://localhost:8761/eureka/}


