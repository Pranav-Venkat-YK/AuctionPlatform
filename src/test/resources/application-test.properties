spring.application.name=auction-service-test

# H2 In-Memory Database Configuration for Integration Testing
spring.datasource.url=jdbc:h2:mem:auction_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Disable Liquibase and Eureka during integration testing
spring.liquibase.enabled=false
eureka.client.enabled=false
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false

# Kafka Test Settings
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.listener.auto-startup=false
app.kafka.topics.bid-placed=bid-placed-topic
app.kafka.topics.auction-activated=auction-activated-topic
app.kafka.topics.auction-closed=auction-closed-topic


# Scheduler Test Settings
app.scheduler.batch-size=50
app.scheduler.fixed-delay-ms=60000
app.outbox.fixed-delay-ms=60000
